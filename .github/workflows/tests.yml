name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools for PDF and screenshot evidence
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - name: Unit, mini-dataset and sample tests (no network, no model calls)
        run: pytest -q code/tests
      - name: Generate and validate output.csv
        run: python code/main.py
