name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: code/requirements-dev.txt
      - run: python -m pip install -r code/requirements-dev.txt
      - run: python -m pytest -c code/pytest.ini code/tests -q
      - run: python code/main.py preflight
